# Supabase pauses free projects after a week without requests. This pings the
# public schedule every three days so the database is awake on contest day.
# Needs repository variables SUPABASE_URL and SUPABASE_ANON_KEY (Settings ->
# Secrets and variables -> Actions -> Variables). Not needed on the Pro plan.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/s_info" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p":{}}' > /dev/null && echo "awake"
